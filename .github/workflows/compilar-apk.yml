name: Compilar APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'fondos/**'
      - 'seguir-viendo.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk FlowLauncher.apk

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FlowLauncher-apk
          path: FlowLauncher.apk

      - name: Publicar en Releases (link directo para la TV)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VC=$(grep -oP 'versionCode\s+\K\d+' app/build.gradle)
          VN=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          gh release create "v${VN}-build-${{ github.run_number }}" FlowLauncher.apk \
            --title "Flow Launcher ${VN} (compilación ${{ github.run_number }})" \
            --notes "versionCode: ${VC}
          versionName: ${VN}
          APK compilado automáticamente desde el commit ${{ github.sha }}" \
            --latest
