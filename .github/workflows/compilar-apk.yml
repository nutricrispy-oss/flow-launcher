name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk FlowLauncher.apk

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FlowLauncher-apk
          path: FlowLauncher.apk

      - name: Publicar en Releases (link directo para la TV)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" FlowLauncher.apk \
            --title "Flow Launcher (compilación ${{ github.run_number }})" \
            --notes "APK compilado automáticamente desde el commit ${{ github.sha }}" \
            --latest
